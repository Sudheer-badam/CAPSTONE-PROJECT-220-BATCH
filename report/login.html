<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Login — Capstone Project 220 | KL University</title>
<link rel="icon" type="image/png" href="favicon.png"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --accent: #6366f1;
    --accent-hover: #4f46e5;
    --accent-light: rgba(99,102,241,0.12);
    --bg: #0f0f13;
    --card: rgba(255,255,255,0.04);
    --border: rgba(255,255,255,0.09);
    --text-primary: #f1f1f3;
    --text-secondary: #9ca3af;
    --error: #f87171;
    --success: #34d399;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Animated gradient background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 20%, rgba(99,102,241,0.18) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 80% 80%, rgba(168,85,247,0.14) 0%, transparent 60%),
      radial-gradient(ellipse 50% 40% at 50% 50%, rgba(59,130,246,0.07) 0%, transparent 70%);
    animation: bgShift 8s ease-in-out infinite alternate;
    pointer-events: none;
  }

  @keyframes bgShift {
    0%  { opacity: 0.8; transform: scale(1); }
    100%{ opacity: 1;   transform: scale(1.04); }
  }

  /* Floating particles */
  .particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    background: rgba(99,102,241,0.25);
    animation: float linear infinite;
  }
  @keyframes float {
    0%   { transform: translateY(110vh) rotate(0deg); opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 1; }
    100% { transform: translateY(-10vh) rotate(720deg); opacity: 0; }
  }

  /* Card */
  .login-card {
    position: relative;
    z-index: 10;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 48px 44px;
    width: 420px;
    max-width: calc(100vw - 32px);
    backdrop-filter: blur(24px);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.06),
      0 32px 64px rgba(0,0,0,0.5),
      0 0 80px rgba(99,102,241,0.08);
    animation: cardIn 0.6s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(30px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0)   scale(1); }
  }

  /* Logo */
  .logo-wrap {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 32px;
  }
  .logo-img {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--accent);
    box-shadow: 0 0 18px rgba(99,102,241,0.4);
  }
  .logo-text h1 {
    font-size: 15px;
    font-weight: 700;
    color: var(--text-primary);
    letter-spacing: -0.01em;
  }
  .logo-text p {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 3px;
  }

  /* Heading */
  .card-heading {
    margin-bottom: 28px;
  }
  .card-heading h2 {
    font-size: 26px;
    font-weight: 800;
    color: var(--text-primary);
    letter-spacing: -0.03em;
  }
  .card-heading p {
    font-size: 14px;
    color: var(--text-secondary);
    margin-top: 6px;
  }

  /* Form */
  .form-group {
    margin-bottom: 18px;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    margin-bottom: 8px;
  }
  input {
    width: 100%;
    padding: 13px 16px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text-primary);
    font-size: 15px;
    font-family: 'Inter', sans-serif;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
  }
  input::placeholder { color: rgba(255,255,255,0.25); }
  input:focus {
    border-color: var(--accent);
    background: rgba(99,102,241,0.07);
    box-shadow: 0 0 0 3px rgba(99,102,241,0.2);
  }
  input.error-field { border-color: var(--error); }

  /* Password toggle */
  .password-wrap { position: relative; }
  .password-wrap input { padding-right: 46px; }
  .btn-eye {
    position: absolute;
    right: 12px; top: 50%;
    transform: translateY(-50%);
    background: none; border: none;
    cursor: pointer; padding: 4px;
    color: var(--text-secondary);
    display: flex; align-items: center;
    transition: color 0.2s;
  }
  .btn-eye:hover { color: var(--text-primary); }

  /* Error msg */
  .error-msg {
    display: none;
    align-items: center;
    gap: 8px;
    background: rgba(248,113,113,0.1);
    border: 1px solid rgba(248,113,113,0.25);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 13px;
    color: var(--error);
    margin-bottom: 18px;
    animation: shake 0.4s ease;
  }
  .error-msg.show { display: flex; }
  @keyframes shake {
    0%,100%{ transform: translateX(0); }
    25%    { transform: translateX(-6px); }
    75%    { transform: translateX(6px); }
  }

  /* Submit button */
  .btn-login {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, var(--accent), #8b5cf6);
    border: none;
    border-radius: 12px;
    color: white;
    font-size: 15px;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    letter-spacing: -0.01em;
    transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
    box-shadow: 0 8px 24px rgba(99,102,241,0.35);
    margin-top: 8px;
  }
  .btn-login:hover:not(:disabled) {
    opacity: 0.9;
    transform: translateY(-1px);
    box-shadow: 0 12px 32px rgba(99,102,241,0.45);
  }
  .btn-login:active { transform: translateY(0); }
  .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-login.loading { position: relative; color: transparent; }
  .btn-login.loading::after {
    content: '';
    position: absolute;
    inset: 50% auto auto 50%;
    width: 20px; height: 20px;
    margin: -10px 0 0 -10px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Hint */
  .login-hint {
    margin-top: 20px;
    text-align: center;
    font-size: 12px;
    color: var(--text-secondary);
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
  }
  .login-hint strong { color: var(--text-primary); font-weight: 600; }

  /* Footer */
  .card-footer {
    margin-top: 28px;
    text-align: center;
    font-size: 12px;
    color: rgba(255,255,255,0.2);
  }
</style>
</head>
<body>

<!-- Floating particles -->
<div class="particles" id="particles"></div>

<div class="login-card">
  <!-- Logo -->
  <div class="logo-wrap">
    <img src="favicon.png" alt="Logo" class="logo-img"/>
    <div class="logo-text">
      <h1>CAPSTONE PROJECT 220</h1>
      <p>AI Sentiment Analysis | KL University</p>
    </div>
  </div>

  <!-- Heading -->
  <div class="card-heading">
    <h2>Welcome back 👋</h2>
    <p>Sign in to access the project report</p>
  </div>

  <!-- Error -->
  <div class="error-msg" id="error-msg">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    <span id="error-text">Invalid credentials. Please try again.</span>
  </div>

  <!-- Form -->
  <form id="login-form" onsubmit="handleLogin(event)">
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="Enter your username" autocomplete="username" required/>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <div class="password-wrap">
        <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required/>
        <button type="button" class="btn-eye" onclick="togglePassword()" id="btn-eye" title="Show/Hide password">
          <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>
    <button class="btn-login" type="submit" id="btn-submit">Sign In →</button>
  </form>

  <!-- Private Access Notice -->
  <div class="login-hint" style="border-color: rgba(99,102,241,0.3); background: rgba(99,102,241,0.07);">
    🔒 <strong style="color:#a5b4fc;">Restricted Access</strong> — Only BATCH 220 team members can log in.
  </div>

  <div class="card-footer">© 2026 Capstone Project 220 — KL University</div>
</div>

<script>
  // Generate particles
  const container = document.getElementById('particles');
  for (let i = 0; i < 18; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = Math.random() * 6 + 3;
    p.style.cssText = `
      width: ${size}px; height: ${size}px;
      left: ${Math.random() * 100}%;
      animation-duration: ${Math.random() * 14 + 10}s;
      animation-delay: ${Math.random() * 10}s;
      opacity: ${Math.random() * 0.4 + 0.1};
    `;
    container.appendChild(p);
  }

  // Toggle password visibility
  function togglePassword() {
    const input = document.getElementById('password');
    const icon  = document.getElementById('eye-icon');
    const show  = input.type === 'password';
    input.type  = show ? 'text' : 'password';
    icon.innerHTML = show
      ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M1 1l22 22"/><circle cx="12" cy="12" r="3" style="display:none"/>'
      : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  }

  // Redirect if already logged in
  if (sessionStorage.getItem('capstone_auth') === 'true') {
    window.location.href = 'index.html';
  }

  // Team members only — username: first name (lowercase), password: roll number
  const VALID_USERS = [
    { username: 'tulasi',  password: '2300032267', fullName: 'Kokkiligadda Tulasi Venkata Durga' },
    { username: 'sudheer', password: '2300033278', fullName: 'Badam Sudheer Reddy' },
    { username: 'karthika',password: '2300030988', fullName: 'Garikapati Satya Karthika' },
    { username: 'kavya',   password: '2300033848', fullName: 'Mitta Kavya Nayana' },
    { username: 'hanitha', password: '2300032512', fullName: 'Inti Hanitha Sai Gayathri' },
  ];

  function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('btn-submit');
    const errBox = document.getElementById('error-msg');
    const usernameEl = document.getElementById('username');
    const passwordEl = document.getElementById('password');

    const username = usernameEl.value.trim();
    const password = passwordEl.value;

    // Reset state
    errBox.classList.remove('show');
    usernameEl.classList.remove('error-field');
    passwordEl.classList.remove('error-field');

    // Loading state
    btn.classList.add('loading');
    btn.disabled = true;

    setTimeout(() => {
      const match = VALID_USERS.find(u => u.username === username && u.password === password);
      if (match) {
        sessionStorage.setItem('capstone_auth', 'true');
        sessionStorage.setItem('capstone_user', match.fullName);
        window.location.href = 'index.html';
      } else {
        btn.classList.remove('loading');
        btn.disabled = false;
        usernameEl.classList.add('error-field');
        passwordEl.classList.add('error-field');
        errBox.classList.add('show');
      }
    }, 900);
  }
</script>
</body>
</html>
